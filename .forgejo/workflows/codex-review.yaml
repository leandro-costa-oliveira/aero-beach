name: Codex Review

on:
  pull_request:
    types:
      - labeled

jobs:
  review:
    name: Review pull request with Codex
    if: ${{ forgejo.event.label.name == 'codex-review' }}
    runs-on: docker
    container:
      image: node:24-alpine
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Run Codex review
        uses: https://git.lhprovedor.com.br/leandro/devops/.forgejo/actions/codex-review@a9aa99c92493e01c802df74f0216f72065d02780
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          forgejo_token: ${{ forgejo.token }}
          base_ref: ${{ forgejo.event.pull_request.base.ref }}
          pull_request_number: ${{ forgejo.event.pull_request.number }}
          server_url: ${{ forgejo.server_url }}
          repository: ${{ forgejo.repository }}
